<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports · AttendPay</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>

    <div class="main-wrapper">
      <header class="top">
        <h1 id="title">Enterprise Reporting & Statements</h1>
        <div class="user">
          <span id="uname"></span>
          <div class="avatar" id="av"></div>
          <button class="btn ghost" onclick="logout()">Sign out</button>
        </div>
      </header>

      <main>
        <div class="notice" id="err" role="alert"></div>

        <div class="card">
          <div class="card-header-row">
            <div>
              <h3>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--primary-accent)" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                Auditable Organization Reports
              </h3>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px">Generate monthly attendance, department distribution and payroll registers</p>
            </div>
            <div class="bar" style="margin-bottom:0">
              <input id="mo" type="month" aria-label="Statement Month" title="Statement Month">
              <button class="btn ghost" onclick="print()">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Print Statement
              </button>
            </div>
          </div>

          <!-- Segmented Tab Navigation -->
          <div class="tabs2" style="margin-top:14px">
            <button class="btn on" data-t="emp">Employee Attendance</button>
            <button class="btn ghost" data-t="pay">Monthly Payroll Register</button>
            <button class="btn ghost" data-t="dep">Department Distribution</button>
          </div>

          <div id="tb" class="scroll" style="margin-top:14px"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
