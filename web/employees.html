<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management · AttendPay</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>

    <div class="main-wrapper">
      <header class="top">
        <h1 id="title">Employee Directory & Management</h1>
        <div class="user">
          <span id="uname"></span>
          <div class="avatar" id="av"></div>
          <button class="btn ghost" onclick="logout()">Sign out</button>
        </div>
      </header>

      <main>
        <div class="notice" id="err" role="alert"></div>

        <!-- Add / Edit Employee Card -->
        <div class="card">
          <div class="card-header-row">
            <div>
              <h3 id="ft">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--primary-accent)" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                Add New Employee
              </h3>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px">Configure employee profile and basic salary details</p>
            </div>
          </div>

          <form id="f" class="fg">
            <input type="hidden" id="id">
            <div>
              <label for="name">Full Name</label>
              <input id="name" placeholder="e.g. John Doe" required autocomplete="name">
            </div>
            <div>
              <label for="dept">Department</label>
              <select id="dept" required></select>
            </div>
            <div>
              <label for="des">Designation</label>
              <input id="des" placeholder="e.g. Senior Software Engineer" required>
            </div>
            <div>
              <label for="sal">Basic Salary (₹)</label>
              <input id="sal" type="number" min="1" step="0.01" placeholder="e.g. 50000" required>
            </div>
            <div>
              <label for="jd">Joining Date</label>
              <input id="jd" type="date" required>
            </div>
            <div class="act">
              <button type="submit" class="btn btn-accent" id="btnSaveEmp">Save Employee</button>
              <button type="button" class="btn ghost" id="rs">Clear</button>
            </div>
          </form>
        </div>

        <!-- Employee Directory Table Card -->
        <div class="card" style="margin-top:22px">
          <div class="card-header-row">
            <div>
              <h3>Organization Roster</h3>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px">View, filter, edit and maintain all registered employees</p>
            </div>
            <div class="bar" style="margin-bottom:0">
              <input id="q" placeholder="🔍 Search by name or ID..." aria-label="Search employees">
              <select id="fd" aria-label="Department Filter"></select>
            </div>
          </div>

          <div id="tb" class="scroll"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
