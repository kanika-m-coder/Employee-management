<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee management · AttendPay</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><i>A</i>AttendPay</div><nav class="nav" id="nav"></nav></aside><div><header class="top"><h1 id="title">Employee management</h1><div class="user"><span id="uname"></span><div class="avatar" id="av"></div><button class="btn ghost" onclick="logout()">Sign out</button></div></header><main><div class="notice" id="err" role="alert"></div><div class="card"><h3 id="ft">Add employee</h3><form id="f" class="fg"><input type="hidden" id="id"><div><label for="name">Name</label><input id="name" required></div><div><label for="dept">Department</label><select id="dept" required></select></div><div><label for="des">Designation</label><input id="des" required></div><div><label for="sal">Basic salary (₹)</label><input id="sal" type="number" min="1" step="0.01" required></div><div><label for="jd">Joining date</label><input id="jd" type="date" required></div><div class="act"><button class="btn">Save employee</button><button type="button" class="btn ghost" id="rs">Clear</button></div></form></div><div class="card"><div class="bar"><input id="q" placeholder="Search by name or ID" aria-label="Search"><select id="fd" aria-label="Department"></select></div><div id="tb" class="scroll"></div></div></main></div></div><script src="js/app.js"></script><script src="js/employees.js"></script></body></html>
