<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance management · AttendPay</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><i>A</i>AttendPay</div><nav class="nav" id="nav"></nav></aside><div><header class="top"><h1 id="title">Attendance management</h1><div class="user"><span id="uname"></span><div class="avatar" id="av"></div><button class="btn ghost" onclick="logout()">Sign out</button></div></header><main><div class="notice" id="err" role="alert"></div><div id="fcard" class="card"><h3>Record attendance</h3><form id="f" class="fg"><div><label for="emp">Employee</label><select id="emp" required></select></div><div><label for="date">Date</label><input id="date" type="date" required></div><div><label for="st">Status</label><select id="st"><option>Present</option><option>Absent</option><option>Half Day</option><option>On Leave</option></select></div><div class="act"><button class="btn">Save attendance</button></div></form></div><div class="card"><div class="bar"><select id="fe" aria-label="Employee"></select><input id="from" type="date" aria-label="From"><input id="to" type="date" aria-label="To"></div><div class="chips" id="sm"></div><div id="tb" class="scroll"></div></div></main></div></div><script src="js/app.js"></script><script src="js/attendance.js"></script></body></html>
