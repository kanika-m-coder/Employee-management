<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Management · AttendPay</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>

    <div class="main-wrapper">
      <header class="top">
        <h1 id="title">Attendance Management & Logs</h1>
        <div class="user">
          <span id="uname"></span>
          <div class="avatar" id="av"></div>
          <button class="btn ghost" onclick="logout()">Sign out</button>
        </div>
      </header>

      <main>
        <div class="notice" id="err" role="alert"></div>

        <!-- Record Attendance Form Card -->
        <div id="fcard" class="card">
          <div class="card-header-row">
            <div>
              <h3>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--primary-accent)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg>
                Mark Daily Attendance
              </h3>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px">Record or update duty status for workforce members</p>
            </div>
          </div>

          <form id="f" class="fg">
            <div>
              <label for="emp">Employee</label>
              <select id="emp" required></select>
            </div>
            <div>
              <label for="date">Attendance Date</label>
              <input id="date" type="date" required>
            </div>
            <div>
              <label for="st">Status</label>
              <select id="st">
                <option value="Present">Present (Full Day)</option>
                <option value="Absent">Absent (Unexcused)</option>
                <option value="Half Day">Half Day (0.5 Day)</option>
                <option value="On Leave">On Leave (Approved)</option>
              </select>
            </div>
            <div class="act">
              <button type="submit" class="btn btn-accent">Save Attendance</button>
            </div>
          </form>
        </div>

        <!-- Attendance Logs & History Card -->
        <div class="card" style="margin-top:22px">
          <div class="card-header-row">
            <div>
              <h3>Attendance Verification Records</h3>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px">Filter attendance by workforce member and timeline range</p>
            </div>
            <div class="bar" style="margin-bottom:0">
              <select id="fe" aria-label="Employee Filter"></select>
              <input id="from" type="date" aria-label="From Date" title="From Date">
              <input id="to" type="date" aria-label="To Date" title="To Date">
            </div>
          </div>

          <!-- Summary Status Chips -->
          <div class="chips" id="sm" style="margin-top:14px"></div>

          <!-- Attendance Table -->
          <div id="tb" class="scroll"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>
