<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave management · AttendPay</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><i>A</i>AttendPay</div><nav class="nav" id="nav"></nav></aside><div><header class="top"><h1 id="title">Leave management</h1><div class="user"><span id="uname"></span><div class="avatar" id="av"></div><button class="btn ghost" onclick="logout()">Sign out</button></div></header><main><div class="notice" id="err" role="alert"></div><div id="fcard" class="card"><h3>Record leave</h3><form id="f" class="fg"><div><label for="emp">Employee</label><select id="emp" required></select></div><div><label for="type">Leave type</label><select id="type"><option>Casual</option><option>Sick</option><option>Earned</option><option>Loss of Pay</option></select></div><div><label for="sd">Start date</label><input id="sd" type="date" required></div><div><label for="ed">End date</label><input id="ed" type="date" required></div><div><label for="stt">Status</label><select id="stt"><option>Approved</option><option>Pending</option><option>Rejected</option></select></div><div><label for="rs">Reason</label><input id="rs"></div><div class="act"><button class="btn">Save leave</button></div></form></div><div class="card"><h3>Leave records</h3><div id="tb" class="scroll"></div></div><div class="card" id="scard"><h3>Absent days per employee</h3><div id="sm" class="scroll"></div></div></main></div></div><script src="js/app.js"></script><script src="js/leave.js"></script></body></html>
