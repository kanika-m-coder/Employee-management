<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Analytics · AttendPay</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>

    <div class="main-wrapper">
      <header class="top">
        <h1 id="title">Workforce Analytics & Python Insights</h1>
        <div class="user">
          <span id="uname"></span>
          <div class="avatar" id="av"></div>
          <button class="btn ghost" onclick="logout()">Sign out</button>
        </div>
      </header>

      <main>
        <div class="notice" id="err" role="alert"></div>

        <!-- Python Intelligence Engine Control & Insights -->
        <div class="card">
          <div class="card-header-row">
            <div>
              <h3>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--primary-accent)" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
                Automated Analytical Insights
              </h3>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px">Engineered with Python (pandas, matplotlib) on historical database records</p>
            </div>
            <div class="bar" style="margin-bottom:0">
              <span id="gen" style="color:var(--text-secondary);font-size:12.5px;align-self:center"></span>
              <button class="btn btn-accent" id="run">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                Refresh Analysis
              </button>
            </div>
          </div>

          <div style="background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;margin-top:14px">
            <h4 style="font-size:13px;font-weight:700;color:var(--secondary-navy);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px">
              Key Diagnostic Findings
            </h4>
            <ul id="ins" style="line-height:2;padding-left:20px;font-size:13.5px;color:var(--text-primary)"></ul>
          </div>
        </div>

        <!-- Rendered Python High-Resolution Charts -->
        <div class="card" style="margin-top:22px">
          <div class="card-header-row">
            <div>
              <h3>Generated Visual Analytics</h3>
              <p style="font-size:12px;color:var(--text-secondary);margin-top:2px">Dynamic chart figures plotted directly from payroll_db</p>
            </div>
          </div>
          <div class="imgs" id="imgs" style="margin-top:14px"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
